	<head><script>// Crash reports for Ashes in the Rain. When a phone's browser kills the page (out of memory) it gets
// no chance to say so; so the game leaves breadcrumbs in localStorage as it runs, and the next load
// sends the last ones home if the page did not go away cleanly. Script errors are sent as they happen.
(function () {
  // A phone draws the game at most at twice its CSS size: at 3x an iPhone pushes 2.25x the pixels
  // through every full-screen pass (and the memory for them) for detail nobody sees at arm's length.
  try {
    var real = window.devicePixelRatio || 1;
    Object.defineProperty(window, 'devicePixelRatio', { get: function () { return Math.min(real, 2); }, configurable: true });
  } catch (e) {}
  // the engine's memory (the WebAssembly heap) for the crash report's heartbeat lines
  var wasmMem = null;
  try {
    var grab = function (res) {
      try {
        var inst = res && (res.instance || res);
        var ex = inst && inst.exports;
        for (var k in ex) if (ex[k] instanceof WebAssembly.Memory) wasmMem = ex[k];
      } catch (e) {}
      return res;
    };
    var oi = WebAssembly.instantiate, ois = WebAssembly.instantiateStreaming;
    WebAssembly.instantiate = function () { return oi.apply(WebAssembly, arguments).then(grab); };
    if (ois) WebAssembly.instantiateStreaming = function () { return ois.apply(WebAssembly, arguments).then(grab); };
  } catch (e) {}
  window.ashesMem = function () { return wasmMem ? Math.round(wasmMem.buffer.byteLength / 1048576) : -1; };
  var URL_ = 'https://mpxfppuigwvwlfhsnbgr.supabase.co/rest/v1/ashes_reports';
  var KEY = 'sb_publishable_X7rB8j45EHq79TnlzSxxsw_slxNAD8G';
  var BUILD = 'ashes-f13442a3';
  var sent = 0;
  function now() { return new Date().toISOString().substr(11, 12); }
  function crumbs() { try { return JSON.parse(localStorage.getItem('ashes_crumbs') || '[]'); } catch (e) { return []; } }
  function crumb(t) {
    try {
      var c = crumbs(); c.push(now() + ' ' + String(t).substr(0, 400));
      if (c.length > 80) c = c.slice(c.length - 80);
      localStorage.setItem('ashes_crumbs', JSON.stringify(c));
    } catch (e) {}
  }
  function send(kind, extra) {
    if (sent >= 6) return; sent++;
    var body = { kind: kind, build: BUILD, device: navigator.userAgent.substr(0, 300),
      report: { crumbs: crumbs(), extra: extra || null, screen: [screen.width, screen.height, window.devicePixelRatio] } };
    try {
      fetch(URL_, { method: 'POST', keepalive: true, headers: { 'apikey': KEY, 'Authorization': 'Bearer ' + KEY,
        'Content-Type': 'application/json', 'Prefer': 'return=minimal' }, body: JSON.stringify(body) }).catch(function () {});
    } catch (e) {}
  }
  window.ashesCrumb = crumb;
  window.ashesReport = send;
  // the last run never said goodbye: it was killed
  try {
    var prev = localStorage.getItem('ashes_alive');
    var prevBuild = localStorage.getItem('ashes_build');
    if (prev === '1' && crumbs().length) {
      send('crash', { previous_build: prevBuild });
    }
    localStorage.setItem('ashes_crumbs', '[]');
    localStorage.setItem('ashes_alive', '1');
    localStorage.setItem('ashes_build', BUILD);
  } catch (e) {}
  crumb('boot ' + BUILD);
  document.addEventListener('visibilitychange', function () {
    try { localStorage.setItem('ashes_alive', document.hidden ? '0' : '1'); } catch (e) {}
    crumb(document.hidden ? 'hidden' : 'visible');
  });
  window.addEventListener('pagehide', function () { try { localStorage.setItem('ashes_alive', '0'); } catch (e) {} });
  window.addEventListener('error', function (e) {
    crumb('JS ERROR ' + (e.message || '') + ' @' + (e.filename || '') + ':' + (e.lineno || ''));
    send('error', { message: String(e.message), at: (e.filename || '') + ':' + (e.lineno || '') });
  });
  window.addEventListener('unhandledrejection', function (e) {
    var m = e.reason && (e.reason.message || String(e.reason));
    crumb('REJECTED ' + m);
    send('error', { message: 'unhandled: ' + m });
  });
  var err = console.error;
  console.error = function () {
    var m = Array.prototype.join.call(arguments, ' ');
    crumb('ERR ' + m);
    if (/SCRIPT ERROR|Failed loading|out of memory|OOM|Aborted/i.test(m)) send('error', { message: m.substr(0, 2000) });
    return err.apply(console, arguments);
  };
  // Anonymous play data (telemetry, user's task list 17. 11.): where players die, which maps they finish, where they
  // leave. One row per event in public.ashes_events (anon can only insert). No personal data: a random id per page
  // load, the build, the map, a position. Off when the setting "SEND ANONYMOUS PLAY DATA" is off (ashes_telemetry=0).
  var SESSION = Math.random().toString(36).substr(2, 10);
  var EV_URL = 'https://mpxfppuigwvwlfhsnbgr.supabase.co/rest/v1/ashes_events';
  var evSent = 0;
  var lastMap = '', lastX = 0;
  window.ashesEvent = function (kind, map, x, y, data) {
    try {
      if (localStorage.getItem('ashes_telemetry') === '0' || evSent >= 200) return;
      evSent++;
      if (map) { lastMap = String(map); lastX = +x || 0; }
      fetch(EV_URL, { method: 'POST', keepalive: true, headers: { 'apikey': KEY, 'Authorization': 'Bearer ' + KEY,
        'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
        body: JSON.stringify({ kind: kind, build: BUILD, session: SESSION, map: String(map || '').substr(0, 60),
          x: +x || 0, y: +y || 0, data: data || null }) }).catch(function () {});
    } catch (e) {}
  };
  window.ashesWhere = function (map, x) { lastMap = String(map || ''); lastX = +x || 0; };   // (every few seconds: where a quit happens)
  window.addEventListener('pagehide', function () { if (lastMap) window.ashesEvent('quit', lastMap, lastX, 0, null); });
  // Haptics (task 9, research ch13): a short buzz on a shot, a hit, a kill, a hard landing, a blast. Android: the
  // Vibration API. iPhone Safari (17.4+) has none, but toggling a hidden <input type="checkbox" switch> ticks the
  // Taptic Engine - only inside a touch handler, so a buzz the game asks for is played on the next touch (the
  // player's thumbs are on the glass all the time). Off when the setting VIBRATION is off (ashes_haptics=0).
  var buzzWant = 0, buzzAt = 0, sw = null;
  function hapticsOn() { try { return localStorage.getItem('ashes_haptics') !== '0'; } catch (e) { return true; } }
  window.ashesBuzz = function (ms) {
    if (!hapticsOn()) return;
    if (navigator.vibrate) { try { navigator.vibrate(Math.max(5, Math.min(60, ms | 0))); } catch (e) {} return; }
    buzzWant = ms; buzzAt = Date.now();
  };
  function tick() {
    if (!buzzWant || Date.now() - buzzAt > 250) { buzzWant = 0; return; }
    buzzWant = 0;
    try {
      if (!sw) {
        var lab = document.createElement('label');
        lab.style.cssText = 'position:fixed;left:-100px;top:-100px;width:1px;height:1px;opacity:0;pointer-events:none';
        sw = document.createElement('input'); sw.type = 'checkbox'; sw.setAttribute('switch', '');
        lab.appendChild(sw); document.body.appendChild(lab); sw._lab = lab;
      }
      sw._lab.click();
    } catch (e) {}
  }
  document.addEventListener('touchstart', tick, { passive: true, capture: true });
  document.addEventListener('touchend', tick, { passive: true, capture: true });
  window.addEventListener('load', function () {
    var cv = document.getElementById('canvas');
    if (cv) cv.addEventListener('webglcontextlost', function () { crumb('WEBGL CONTEXT LOST'); send('error', { message: 'webgl context lost' }); });
  });
})();
</script>

		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"ashes-f13442a3","experimentalVK":false,"fileSizes":{"ashes-f13442a3.pck":75754704,"ashes-f13442a3.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
